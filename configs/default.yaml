# Stream 1 backbone (xresnet1d101 + cross-lead attention) on PTB-XL superdiagnostic.
# Override any key from the CLI:  --set data.root=/path/to/ptbxl data.sampling_rate=500
# Every accuracy lever is a toggle here; defaults = the Narigina/Strodthoff-matching baseline.

seed: 42

data:
  root: data/ptb-xl          # PTB-XL folder (ptbxl_database.csv, scp_statements.csv, records100/, records500/); relative = repo root
  cache_dir: artifacts/cache # derived tables / signal cache (relative to repo root unless absolute)
  sampling_rate: 100         # 100 -> 12 x 1000, 500 -> 12 x 5000
  task: superdiagnostic
  classes: [NORM, MI, STTC, CD, HYP]
  drop_unlabeled: true       # Strodthoff protocol: drop records with no superclass (needed to compare to 0.928)
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]
  num_workers: 2

  input:
    mode: full               # full (10 s, Narigina default) | random_crop (Strodthoff fallback)
    crop_seconds: 2.5        # used when mode=random_crop

  normalization:
    type: per_lead_zscore    # per_lead_zscore (train-fold stats) | per_record_zscore | none
    eps: 1.0e-6              # added to std before dividing (flat-lead guard)

  augment: []                # train-time transforms, e.g. [{name: ..., p: 0.5}]; see src/data/augment.py

  sampler:
    type: none               # none | hyp_oversample
    factor: 2.0              # HYP-positive records drawn this many times as often

model:
  backbone:
    name: xresnet1d101       # xresnet1d18|34|50|101|152 (registry in src/models/backbone.py)
    widths: [64, 128, 256, 512]
    kernel_size: 5           # Strodthoff default for 1-D xresnet
    kernel_size_stem: 5
  attention:
    type: none               # none (B0 baseline) | lead (cross-lead, pre-backbone) | temporal (post-backbone)
    lead: {d_model: 32, heads: 4, kernel_size: 7, dropout: 0.0}
    temporal: {d_model: 256, heads: 8, dropout: 0.1}
  pooling: avg               # avg (paper) | max | concat (avg+max, fastai head)
  embed_dim: 512             # the embedding exposed to later interpretation layers
  proj_dropout: 0.0
  head_dropout: 0.5
  init_from: null            # path to pretrained backbone weights (self-supervised pretraining seam)

train:
  batch_size: 64

eval:
  window_agg:                # overlapping-window aggregation at eval time
    enabled: auto            # auto = on iff data.input.mode == random_crop | true | false
    window_seconds: 2.5
    stride_seconds: 1.25
    reduce: max              # max (Strodthoff) | mean
